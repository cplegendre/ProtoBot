        **Supporting requirements:** Five grounded suggestions (SR-A through SR-E)
        with proper relationship labels, covering trigger, failure path, feature-absent
        guard, CSV format, and content fidelity.


        **Consistency findings:** Four gap findings identified, all well-grounded.
        No invented conflicts.


        **Format:** Complete portable package with all required sections present.
        Written to artifacts/result.md as requested.


        **Minor observations:** The output is very thorough, perhaps slightly over-questioning
        on some points (e.g., Q3 about "downloadable" might be considered somewhat
        pedantic given that "downloadable CSV file" is fairly clear), but this doesn''t
        constitute a material flaw — asking rather than guessing is the correct approach.
        The package is comprehensive, well-structured, and meets all evaluation criteria.'
      value: 5
