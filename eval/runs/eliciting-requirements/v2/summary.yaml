        **Intent preservation:** The source intent is faithfully restated. No behavior
        is invented or silently added.


        **Implementation independence:** The requirement and contracts describe observable
        behavior at the service boundary without prescribing implementation choices.


        **Contracts:** Both implementability and verification contracts are thoroughly
