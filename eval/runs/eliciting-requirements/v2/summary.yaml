    semantic_quality:
      judge_type: llm
      rationale: '**Template selection:** The output correctly identifies the EARS
        "Optional feature" pattern (`Where`). It explicitly explains why this is not
        a runtime state (`While`) or a discrete event (`When`), noting it''s a product
        configuration condition. This matches `expected_templates: [''optional feature'']`.


        **Required findings:**

        1. *"Distinguish an included capability from an ordinary runtime condition"*:
        Clearly satisfied. The output states: "The source does not describe a runtime
        state (''while offline mode is active'') or a discrete event. It describes
        a product configuration condition — the feature is either included or not
        — which is the defining characteristic of the `Where` pattern." Also in assumptions:
        "This interpretation was chosen because the source uses it as a feature name
        in the EARS `Where` clause, not as a description of runtime network state."

        2. *"Identify selected-report and CSV observables"*: Satisfied. Q2 asks about
